<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生110事件数据处理系统</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
        <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        /* Abstract decorative blobs */
        .blob-1 {
            position: absolute; width: 500px; height: 500px; background: linear-gradient(135deg, #4f46e5, #ec4899);
            border-radius: 50%; top: -150px; left: -100px; filter: blur(80px); opacity: 0.4; z-index: 0;
        }
        .blob-2 {
            position: absolute; width: 400px; height: 400px; background: linear-gradient(135deg, #0ea5e9, #10b981);
            border-radius: 50%; bottom: -100px; right: -50px; filter: blur(80px); opacity: 0.3; z-index: 0;
        }
        
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .login-card .brand-icon {
            font-size: 3.5rem;
            color: #4f46e5;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        .login-card h4 {
            text-align: center;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }
        .form-floating > label {
            color: #64748b;
        }
        .form-control {
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            height: 58px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            border-color: #4f46e5;
            background-color: #ffffff;
        }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 15px;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
        }
        .register-link {
            text-align: center;
            margin-top: 25px;
            display: block;
            text-decoration: none;
            color: #64748b;
            font-weight: 500;
            transition: color 0.2s;
        }
        .register-link:hover { color: #4f46e5; }
        .version-info {
            text-align: center;
            margin-top: 30px;
        }
        .version-info small { color: #94a3b8 !important; font-weight: 500; }
    </style>
</head>
<body>

    <div class="blob-1"></div><div class="blob-2"></div>
    <div class="login-wrapper">
        <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h4>系统登录</h4>
        
        <form action="{{ url_for('main.login') }}" method="POST">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <div class="mb-3">
                <label class="form-label text-muted small">账号</label>
                <input type="text" name="username" class="form-control" placeholder="请输入您的账号" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">登 录</button>
        </form>

        <a href="#" class="register-link"><small>还没有账号？点击注册</small></a>

        <!-- 版本号和开发者标识规范要求位置 -->
        <div class="version-info">
            <small class="text-muted">版本 v1.0.0 | Developer: WQ</small>
        </div>
    </div>
    </div>

</body>
</html>
